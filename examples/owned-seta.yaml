source:
  kind: seeds
  path: workspace/seta/seeds.jsonl
pipeline:
  name: terminal_synth
  recipe: seta_seed2synth
  options:
    target: 20
    max_candidates: 30
    max_repairs: 2
llm:
  provider: anthropic
  model: claude-sonnet-4-6
execution:
  campaign_dir: workspace/seta
  run_id: seta-first
  worker_receipt: workspace/seta/workers/seta-worker.json
  runtime_wheel: dist/repo2rlenv-0.8.8-py3-none-any.whl
  timeout_sec: 7200
output:
  destination: workspace/seta/tasks
  org: repo2rlenv
  dataset_name: seta-first
  visibility: private
