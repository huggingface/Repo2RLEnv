source:
  kind: pr
  urls:
    - https://github.com/more-itertools/more-itertools/pull/1270
pipeline:
  name: pr_to_env
  recipe: swe_gen
  options:
    source_paths: [more_itertools/more.py, more_itertools/recipes.py]
    test_paths: [tests]
    target: 20
    max_candidates: 40
    force_generate_instruction: true
llm:
  provider: anthropic
  model: claude-sonnet-4-6
  timeout_sec: 240
execution:
  campaign_dir: workspace/campaign
  run_id: swe-gen-first
  worker_receipt: workspace/campaign/workers/worker.json
  runtime_wheel: dist/repo2rlenv-0.8.8-py3-none-any.whl
  timeout_sec: 10000
output:
  destination: workspace/campaign/generated/swe-gen
  org: repo2rlenv
  dataset_name: swe-gen-first
  visibility: private
