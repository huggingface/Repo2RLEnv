source:
  kind: seeds
  path: workspace/endless_terminals-sampler.json
pipeline:
  name: terminal_synth
  recipe: endless_terminals
  options:
    target: 20
    max_candidates: 40
    max_repairs: 2
llm:
  provider: anthropic
  model: claude-sonnet-4-6
execution:
  campaign_dir: workspace/campaign
  run_id: endless_terminals-first
  worker_receipt: workspace/campaign/workers/worker.json
  runtime_wheel: dist/repo2rlenv-0.8.8-py3-none-any.whl
  timeout_sec: 14000
output:
  destination: workspace/generated/endless_terminals
  org: your-org
  dataset_name: endless_terminals-first
  visibility: private
