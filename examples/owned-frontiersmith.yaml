source:
  kind: seeds
  path: examples/frontiersmith-seeds.json
pipeline:
  name: optimization_synth
  recipe: frontiersmith
  options:
    target: 10
    max_candidates: 20
    solutions: 3
    max_repairs: 2
    rollout_tasks: 1
llm:
  provider: openai
  model: gpt-6-sol
  timeout_sec: 300
execution:
  campaign_dir: workspace/frontiersmith
  run_id: pilot
  worker_receipt: workspace/frontiersmith/workers/frontiersmith-pilot.json
  runtime_wheel: dist/repo2rlenv-0.9.2-py3-none-any.whl
  timeout_sec: 14400
output:
  destination: workspace/frontiersmith/tasks
  org: repo2rlenv
  dataset_name: frontiersmith-pilot
  visibility: private
