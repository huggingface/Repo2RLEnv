name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - website/**
      - src/repo2rlenv/pipelines/recipes/**
      - src/repo2rlenv/tasksmith/**
      - src/repo2rlenv/quality/**
      - src/repo2rlenv/campaigns/structured.py
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

# Cancel any in-progress deploy when a new one starts.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true


permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The prompt reference is generated from canonical sources with Python.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        working-directory: website
        run: npm ci

      - name: Build the static site
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /Repo2RLEnv
        run: npm run build

      - name: Check internal links and anchors
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /Repo2RLEnv
        run: node tools/check-links.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: website/out

  deploy:
    permissions:
      id-token: write
      pages: write
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
