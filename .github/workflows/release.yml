name: Release

# Triggered when a GitHub Release is published.
# Build the sdist + wheel, attach them to the Release, then publish to PyPI
# using the PYPI_API_TOKEN repo secret.
#
# Prerequisite: add a project-scoped PyPI API token as a GitHub repo secret
# named PYPI_API_TOKEN. Generate at:
#   https://pypi.org/manage/account/token/
# Add at:
#   https://github.com/adithya-s-k/Repo2RLEnv/settings/secrets/actions/new
#
# To cut a release:
#   git tag v0.3.0 && git push origin v0.3.0
#   gh release create v0.3.0 --generate-notes
# (or use the GitHub UI to draft + publish a release pointing at the tag).

on:
  release:
    types: [published]
  # Manual trigger — useful for re-running a failed publish after fixing the
  # trusted-publisher setup. Won't double-publish a version PyPI already has.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0); must already exist"
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows compatibility
    uses: ./.github/workflows/windows.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  # Sanity gate — run the full test suite on the release tag before we publish.
  test:
    permissions:
      contents: read
    name: Tests on release tag (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: ${{ matrix.python-version }}

      - run: uv sync --group dev --all-extras --frozen
      - run: uv run --all-extras pytest -q

  tasksmith-runtimes:
    permissions:
      contents: read
    name: Tasksmith coding runtime contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          enable-cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - run: uv sync --extra tasksmith --frozen
      - run: uv run repo2rlenv tasksmith install-runtime
      - name: Exercise real SDKs against local mock servers
        run: |
          TASKSMITH_TEST_RUNTIME=$(uv run python -c 'from repo2rlenv.tasksmith.runtime import directory; print(directory())') node --test tests/test_tasksmith_pi.mjs tests/test_tasksmith_opencode.mjs

  build:
    permissions:
      contents: read
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    needs: [test, tasksmith-runtimes, windows]
    outputs:
      version: ${{ steps.read-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
          python-version: "3.12"

      - name: Read package version
        id: read-version
        run: |
          version=$(uv run python -c "from importlib.metadata import version; print(version('repo2rlenv'))" 2>/dev/null \
                    || grep -E '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "Package version: $version"

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PKG_VERSION: ${{ steps.read-version.outputs.version }}
        run: |
          tag="$RELEASE_TAG"
          expected="v$PKG_VERSION"
          if [ "$tag" != "$expected" ]; then
            echo "::error::Release tag $tag does not match package version $expected — bump pyproject.toml first"
            exit 1
          fi

      - name: Build distributions
        run: |
          rm -rf dist/
          uv build

      - name: Verify wheel installs cleanly
        run: |
          uv venv /tmp/check-install
          uv pip install --python /tmp/check-install/bin/python dist/*.whl
          /tmp/check-install/bin/repo2rlenv --version
          /tmp/check-install/bin/python tests/check_distribution.py dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          retention-days: 30

  publish-pypi:
    permissions: {}
    name: Publish to PyPI (API token)
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/p/repo2rlenv
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # API-token auth via the PYPI_API_TOKEN repo secret. (We can move
          # to OIDC trusted-publishing later by deleting `password:` and adding
          # `permissions: id-token: write` + a pending publisher on pypi.org.)
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          # Skip if PyPI already has this version (allows re-runs after fix)
          skip-existing: true
          print-hash: true

  attach-to-release:
    name: Attach sdist + wheel to GitHub Release
    runs-on: ubuntu-latest
    # Only on actual release events; the workflow_dispatch path skips this
    if: github.event_name == 'release'
    needs: [build, publish-pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/

      - name: Upload distribution files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO_SLUG: ${{ github.repository }}
        run: |
          gh release upload "$RELEASE_TAG" dist/* \
            --repo "$REPO_SLUG" \
            --clobber
