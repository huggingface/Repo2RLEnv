version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      python-compatible:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/src/repo2rlenv/tasksmith/author/runtimes"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      coding-runtimes:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      docs-site-security:
        applies-to: security-updates
        patterns: ["*"]
      docs-site:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Remotion must match the version the vendored films were built with
      # (hf-motion embed/build.mjs); bump it together with a rebuilt films.mjs.
      - dependency-name: "remotion"
      - dependency-name: "@remotion/*"
